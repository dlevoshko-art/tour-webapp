<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Подбор тура — TourVisor</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #f4f5f7);
      --text-color: var(--tg-theme-text-color, #1c1c1e);
      --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
      --button-bg: var(--tg-theme-button-color, #ff6b35);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
      --hint-color: var(--tg-theme-hint-color, #8e8e93);
      --border-color: rgba(0, 0, 0, 0.08);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }

    h2 {
      font-size: 18px;
      margin: 0 0 14px 0;
      text-align: center;
      font-weight: 700;
    }

    .form-group {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      border: 1px solid var(--border-color);
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--hint-color);
      text-transform: uppercase;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-color);
      color: var(--text-color);
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .row > div {
      flex: 1;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .checkbox-group input {
      width: 18px;
      height: 18px;
      accent-color: var(--button-bg);
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background-color: #ff6b35;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 10px;
    }

    .submit-btn:active {
      opacity: 0.85;
    }
  </style>
</head>
<body>

  <h2>🔍 Параметры тура (TourVisor)</h2>

  <form id="tourForm">
    <div class="form-group">
      <label>Курорт / Страна</label>
      <select id="country">
        <option value="Турция" selected>Турция 🇹🇷</option>
        <option value="Египет">Египет 🇪🇬</option>
        <option value="ОАЭ">ОАЭ 🇦🇪</option>
        <option value="Таиланд">Таиланд 🇹🇭</option>
        <option value="Мальдивы">Мальдивы 🇲🇻</option>
        <option value="Россия">Россия (Сочи) 🇷🇺</option>
      </select>
    </div>

    <div class="form-group">
      <label>Даты вылета</label>
      <div class="row">
        <div>
          <input type="date" id="dateFrom">
        </div>
        <div>
          <input type="date" id="dateTo">
        </div>
      </div>
    </div>

    <div class="form-group">
      <div class="row">
        <div>
          <label>Ночей</label>
          <select id="nights">
            <option value="7" selected>7 ночей (6-8)</option>
            <option value="10">10 ночей (9-11)</option>
            <option value="14">14 ночей (12-14)</option>
          </select>
        </div>
        <div>
          <label>Взрослых</label>
          <select id="adults">
            <option value="1">1 взрослый</option>
            <option value="2" selected>2 взрослых</option>
            <option value="3">3 взрослых</option>
          </select>
        </div>
      </div>
    </div>

    <div class="form-group">
      <label>Бюджет (₽)</label>
      <div class="row">
        <div>
          <input type="number" id="priceMin" value="100000" step="5000">
        </div>
        <div>
          <input type="number" id="priceMax" value="200000" step="5000">
        </div>
      </div>
    </div>

    <div class="form-group">
      <label>Тип питания</label>
      <select id="meal">
        <option value="Все включено (AI/UAI)" selected>Все включено (AI / UAI)</option>
        <option value="Полный пансион (FB)">Полный пансион (FB)</option>
        <option value="Завтрак и ужин (HB)">Завтрак и ужин (HB)</option>
        <option value="Только завтрак (BB)">Только завтрак (BB)</option>
      </select>
    </div>

    <div class="form-group">
      <label class="checkbox-group">
        <input type="checkbox" id="directFlight" checked>
        <span>Только прямой перелет</span>
      </label>
    </div>

    <button type="button" class="submit-btn" id="sendBtn">Найти на TourVisor</button>
  </form>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const now = new Date();
    const dFrom = new Date(now.getTime() + 7 * 24 * 60 * 60 * 1000);
    const dTo = new Date(now.getTime() + 14 * 24 * 60 * 60 * 1000);
    document.getElementById('dateFrom').value = dFrom.toISOString().split('T')[0];
    document.getElementById('dateTo').value = dTo.toISOString().split('T')[0];

    function sendTourData() {
      const payload = {
        country: document.getElementById('country').value,
        date_from: document.getElementById('dateFrom').value,
        date_to: document.getElementById('dateTo').value,
        nights: document.getElementById('nights').value,
        adults: parseInt(document.getElementById('adults').value, 10),
        price_min: parseFloat(document.getElementById('priceMin').value) || 0,
        price_max: parseFloat(document.getElementById('priceMax').value) || 200000,
        meal: document.getElementById('meal').value,
        direct_only: document.getElementById('directFlight').checked
      };

      try {
        tg.sendData(JSON.stringify(payload));
      } catch (e) {
        console.error("sendData error:", e);
      }
      tg.close();
    }

    document.getElementById('sendBtn').addEventListener('click', sendTourData);

    // Нативная нижняя кнопка Telegram
    tg.MainButton.setText("Найти на TourVisor");
    tg.MainButton.show();
    tg.MainButton.onClick(sendTourData);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Подбор тура — TourVisor</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #f4f5f7);
      --text-color: var(--tg-theme-text-color, #1c1c1e);
      --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
      --button-bg: var(--tg-theme-button-color, #ff6b35);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
      --hint-color: var(--tg-theme-hint-color, #8e8e93);
      --border-color: rgba(0, 0, 0, 0.08);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }

    h2 {
      font-size: 20px;
      margin: 0 0 16px 0;
      text-align: center;
      font-weight: 700;
    }

    .form-group {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid var(--border-color);
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--hint-color);
      text-transform: uppercase;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    input, select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-color);
      color: var(--text-color);
      font-size: 15px;
      box-sizing: border-box;
      outline: none;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .row > div {
      flex: 1;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .checkbox-group input {
      width: 20px;
      height: 20px;
      accent-color: var(--button-bg);
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background-color: var(--button-bg);
      color: var(--button-text);
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 12px rgba(255, 107, 53, 0.25);
    }

    .submit-btn:active {
      opacity: 0.85;
      transform: scale(0.99);
    }
  </style>
</head>
<body>

  <h2>🔍 Параметры тура (TourVisor)</h2>

  <form id="tourForm">
    <!-- Направление -->
    <div class="form-group">
      <label>Курорт / Страна</label>
      <select id="country">
        <option value="Турция" selected>Турция 🇹🇷</option>
        <option value="Египет">Египет 🇪🇬</option>
        <option value="ОАЭ">ОАЭ 🇦🇪</option>
        <option value="Таиланд">Таиланд 🇹🇭</option>
        <option value="Мальдивы">Мальдивы 🇲🇻</option>
        <option value="Россия">Россия (Сочи) 🇷🇺</option>
      </select>
    </div>

    <!-- Даты вылета -->
    <div class="form-group">
      <label>Даты вылета</label>
      <div class="row">
        <div>
          <input type="date" id="dateFrom">
        </div>
        <div>
          <input type="date" id="dateTo">
        </div>
      </div>
    </div>

    <!-- Ночей и Туристов -->
    <div class="form-group">
      <div class="row">
        <div>
          <label>Ночей</label>
          <select id="nights">
            <option value="6-8" selected>7 ночей (6-8)</option>
            <option value="9-11">10 ночей (9-11)</option>
            <option value="12-14">14 ночей (12-14)</option>
          </select>
        </div>
        <div>
          <label>Взрослых</label>
          <select id="adults">
            <option value="1">1 взрослый</option>
            <option value="2" selected>2 взрослых</option>
            <option value="3">3 взрослых</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Бюджет (Диапазон цен) -->
    <div class="form-group">
      <label>Бюджет (₽)</label>
      <div class="row">
        <div>
          <input type="number" id="priceMin" placeholder="От (100 000)" value="100000" step="5000">
        </div>
        <div>
          <input type="number" id="priceMax" placeholder="До (250 000)" value="200000" step="5000">
        </div>
      </div>
    </div>

    <!-- Питание -->
    <div class="form-group">
      <label>Тип питания</label>
      <select id="meal">
        <option value="AI_UAI" selected>Все включено (AI / UAI)</option>
        <option value="FB">Полный пансион (FB)</option>
        <option value="HB">Завтрак и ужин (HB)</option>
        <option value="BB">Только завтрак (BB)</option>
        <option value="RO">Без питания (RO)</option>
      </select>
    </div>

    <!-- Перелет -->
    <div class="form-group">
      <label class="checkbox-group">
        <input type="checkbox" id="directFlight" checked>
        <span>Только прямой перелет (без пересадок)</span>
      </label>
    </div>

    <button type="button" class="submit-btn" id="sendBtn">Найти на TourVisor</button>
  </form>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // Автоматическая подстановка дефолтных дат (+7 дней и +14 дней)
    const now = new Date();
    const dFrom = new Date(now.getTime() + 7 * 24 * 60 * 60 * 1000);
    const dTo = new Date(now.getTime() + 14 * 24 * 60 * 60 * 1000);
    document.getElementById('dateFrom').value = dFrom.toISOString().split('T')[0];
    document.getElementById('dateTo').value = dTo.toISOString().split('T')[0];

    document.getElementById('sendBtn').addEventListener('click', () => {
      const payload = {
        country: document.getElementById('country').value,
        date_from: document.getElementById('dateFrom').value,
        date_to: document.getElementById('dateTo').value,
        nights: document.getElementById('nights').value,
        adults: parseInt(document.getElementById('adults').value, 10),
        price_min: parseFloat(document.getElementById('priceMin').value) || 0,
        price_max: parseFloat(document.getElementById('priceMax').value) || 0,
        meal: document.getElementById('meal').value,
        direct_only: document.getElementById('directFlight').checked
      };

      // Передаем собранные данные в Telegram-бота
      tg.sendData(JSON.stringify(payload));
    });
  </script>
</body>
</html>
